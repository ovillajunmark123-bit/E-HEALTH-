<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online Consultation</title>
  <style>
    body { margin:0; font-family:'Georgia',serif; background:linear-gradient(135deg,#000428,#004e92); color:white; }
    header { background:#001f3f; padding:20px; text-align:center; font-size:2em; color:gold; text-shadow:0 0 10px #ffcc00; }
    .container { max-width:900px; margin:40px auto; text-align:center; }
    .video-box { background:rgba(255,255,255,0.1); border:2px solid gold; border-radius:10px; padding:20px; margin-bottom:30px; }
    .chat-box { background:rgba(255,255,255,0.1); border:2px solid gold; border-radius:10px; padding:20px; }
    input { width:80%; padding:10px; margin-top:10px; border-radius:5px; border:none; }
    button { margin-top:20px; padding:10px 20px; background:gold; border:none; border-radius:5px; cursor:pointer; font-weight:bold; color:#333; }
    button:hover { background:#ff9900; }
  </style>
</head>
<body>
  <header>Barangay E-Health | Online Consultation</header>
  <div class="container">
    <div class="video-box">
      <h2>Live Consultation</h2>
      <p>Consultation in Progress</p>
      <p>Patient: Juan Dela Cruz</p>
      <p>Time: 10:30 AM - 11:00 AM</p>
    </div>
    <div class="chat-box">
      <h3>Chat with Health Professional</h3>
      <input type="text" placeholder="Type your message...">
      <button>Send</button>
    </div>
    <button onclick="location.href='services.html'">⬅ Back to Dashboard</button>
  </div>
</body>
</html>
